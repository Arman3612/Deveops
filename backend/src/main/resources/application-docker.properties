spring.application.name=proctor

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://mysql:3306/proctordb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=exampassword

# Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 disabled in Docker
spring.h2.console.enabled=false

# Enable Rabbit listener in Docker
spring.rabbitmq.listener.enabled=true
spring.autoconfigure.exclude=
